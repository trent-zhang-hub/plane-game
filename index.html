<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>经典飞机大战</title>
  <!-- PWA：允许添加到主屏幕后全屏运行 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="飞机大战">
  <link rel="manifest" href='data:application/manifest+json,{"name":"经典飞机大战","short_name":"飞机大战","display":"standalone","orientation":"portrait","background_color":"#111111","theme_color":"#111111"}'>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #gameCanvas {
      display: block;
      touch-action: none; /* 禁用浏览器默认触摸行为（滚动/缩放/菜单） */
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="480" height="700"></canvas>
<script>
// ============================================================
// 画布与上下文
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 480, H = 700;

// ============================================================
// 游戏常量
// ============================================================
const FIRE_INTERVAL      = 200;    // 自动开火间隔(ms)
const SPAWN_INTERVAL     = 1200;   // 敌机生成间隔(ms)
const BULLET_SPEED       = 14;     // 子弹每帧移动像素
const BG_SCROLL_SPEED    = 1.5;    // 背景滚动速度
const UPGRADE_DURATION   = 15 * 60; // 子弹升级持续帧数(15秒@60fps)
const INVINCIBLE_FRAMES  = 120;    // 复活无敌帧数(2秒@60fps)
const DOUBLE_TAP_MS      = 300;    // 双击检测时间窗口(ms)

// ============================================================
// Canvas 自适应缩放（保持 480×700 逻辑分辨率，CSS 尺寸随窗口变化）
// ============================================================
function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ============================================================
// 图片资源定义
// ============================================================
const IMG = {};
const IMG_LIST = [
  ['bg',           '图片/background.png'],
  ['plane1',       '图片/玩家飞机-1.png'],
  ['plane2',       '图片/玩家飞机-2.png'],
  ['planeDie1',    '图片/玩家飞机-3.png'],
  ['planeDie2',    '图片/玩家飞机-4.png'],
  ['planeDie3',    '图片/玩家飞机-5.png'],
  ['planeDie4',    '图片/玩家飞机-6.png'],
  ['e1n',          '图片/敌机1-1.png'],
  ['e1d1',         '图片/敌机1-2.png'],
  ['e1d2',         '图片/敌机1-3.png'],
  ['e1d3',         '图片/敌机1-4.png'],
  ['e1d4',         '图片/敌机1-5.png'],
  ['e2n',          '图片/敌机2-1.png'],
  ['e2d1',         '图片/敌机2-4.png'],
  ['e2d2',         '图片/敌机2-5.png'],
  ['e2d3',         '图片/敌机2-6.png'],
  ['e2d4',         '图片/敌机2-7.png'],
  ['e2d5',         '图片/敌机2-8.png'],
  ['e3n',          '图片/敌机3-1.png'],
  ['e3d1',         '图片/敌机3-7.png'],
  ['e3d2',         '图片/敌机3-8.png'],
  ['e3d3',         '图片/敌机3-9.png'],
  ['e3d4',         '图片/敌机3-10.png'],
  ['e3d5',         '图片/敌机3-11.png'],
  ['e3d6',         '图片/敌机3-12.png'],
  ['e3d7',         '图片/敌机3-13.png'],
  ['bullet1',      '图片/子弹1.png'],
  ['bullet2',      '图片/子弹2.png'],
  ['bombSupply',   '图片/bomb_supply.png'],
  ['bulletSupply', '图片/bullet_supply.png'],
  ['lifeIcon',     '图片/生命.png'],
  ['bombIcon',     '图片/炸弹.png'],
  ['gameoverImg',  '图片/gameover.png'],
  ['againImg',     '图片/again.png'],
];

// ============================================================
// 音效资源定义
// ============================================================
const SFX = {};
const SFX_LIST = [
  ['bgm',       '声音/背景音乐.wav'],
  ['hit',       '声音/子弹打中.wav'],
  ['die1',      '声音/敌机1_阵亡.wav'],
  ['die2',      '声音/敌机2_阵亡.wav'],
  ['bossIn',    '声音/敌机3_出现.wav'],
  ['die3',      '声音/敌机3_阵亡.wav'],
  ['playerDie', '声音/玩家阵亡.wav'],
  ['upgrade',   '声音/升级.wav'],
  ['bombUse',   '声音/使用炸药.wav'],
  ['getBullet', '声音/捡到子弹.wav'],
  ['getBomb',   '声音/捡到炸药包.wav'],
];

// ============================================================
// 游戏状态变量
// ============================================================
let state = 'LOADING';  // LOADING | WAITING | PLAYING | PAUSED | GAME_OVER
let score = 0;
let frameCount = 0;
let lastFireTime  = 0;
let lastSpawnTime = 0;
let bombFlash     = 0;   // 炸弹爆炸白色闪光倒计帧
let lastTapTime   = 0;   // 双击检测时间戳
let touchStartX = 0, touchStartY = 0;     // touchstart 时的触点 canvas 坐标
let playerStartX = 0, playerStartY = 0;   // touchstart 时的飞机位置
let bgmAudio      = null; // 背景音乐引用，用于重置时重播
let muted         = false; // 全局静音状态
let highScores    = [];    // 前三高分（localStorage 持久化）
let blendCanvas   = null; // 预渲染背景接缝渐变
let touchMoved    = false; // 触摸移动超过阈值时置 true，抑制误触双击炸弹
let prePauseState = null;  // 暂停前状态，恢复时使用

// 按钮区域
const MUTE_BTN = { x: W - 52, y: 6, w: 44, h: 36 };
const QUIT_BTN = { x: W / 2 - 80, y: H / 2 + 185, w: 160, h: 34 };
const BOMB_BTN = { x: W - 80, y: H - 80, w: 70, h: 70 };

// 背景两块面板的 Y 坐标（初始：面板1在顶部，面板2在其上方）
let bgY1 = 0, bgY2 = -H;

// 游戏实体数组
let bullets  = [];
let enemies  = [];
let supplies = [];

// 玩家对象（resetGame 时初始化）
let player = {};

// ============================================================
// 工具函数
// ============================================================
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// 轴对齐矩形碰撞（AABB）
function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// 播放音效：克隆节点以支持同时多次播放
const SFX_POOL = {};  // 每个音效预建 3 个实例，轮转复用，避免 GC

function initSfxPool() {
  Object.keys(SFX).forEach(key => {
    if (key === 'bgm') return;
    const pool = Array.from({ length: 3 }, () => {
      const a = SFX[key].cloneNode();
      a.volume = 0.6;
      return a;
    });
    pool._idx = 0;
    SFX_POOL[key] = pool;
  });
}

function playSound(key) {
  if (muted) return;
  const pool = SFX_POOL[key];
  if (!pool) return;
  try {
    const audio = pool[pool._idx % pool.length];
    pool._idx++;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } catch(e) {}
}

// 切换静音状态
function toggleMute() {
  muted = !muted;
  if (bgmAudio) bgmAudio.muted = muted;
}

// 预渲染背景接缝渐变纹理（避免每帧创建 CanvasGradient）
function initBlendCanvas() {
  const BLEND = 100;
  blendCanvas = document.createElement('canvas');
  blendCanvas.width = W;
  blendCanvas.height = BLEND * 2;
  const bctx = blendCanvas.getContext('2d');
  const grad = bctx.createLinearGradient(0, 0, 0, BLEND * 2);
  grad.addColorStop(0,   'rgba(0,0,0,0)');
  grad.addColorStop(0.4, 'rgba(0,0,0,0.30)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.30)');
  grad.addColorStop(1,   'rgba(0,0,0,0)');
  bctx.fillStyle = grad;
  bctx.fillRect(0, 0, W, BLEND * 2);
}

// ============================================================
// 玩家初始化（每局开始调用）
// ============================================================
function initPlayer() {
  player = {
    x: W / 2 - 51,      // 水平居中（102/2=51）
    y: H - 126 - 30,     // 距底部 30px
    w: 102, h: 126,
    lives: 3,            // 生命值
    bombs: 3,            // 炸弹数量
    bulletMode: 0,       // 0=普通单发 1=双发升级
    bulletTimer: 0,      // 子弹升级剩余帧
    frameIdx: 0,         // 飞行动画当前帧（0 或 1）
    frameTimer: 0,       // 帧计时器
    dead: false,         // 是否处于死亡动画
    deathFrame: 0,       // 死亡动画当前帧（0~3）
    deathTimer: 0,       // 死亡帧切换计时
    invincible: false,   // 复活后无敌状态
    invincibleTimer: 0,  // 无敌剩余帧数
  };
}

// ============================================================
// 历史积分榜（localStorage，前三名）
// ============================================================
function loadHighScores() {
  try {
    highScores = JSON.parse(localStorage.getItem('planeHighScores') || '[]');
  } catch(e) {
    highScores = [];
  }
}

function saveHighScore(s) {
  highScores.push(s);
  highScores.sort((a, b) => b - a);
  highScores = highScores.slice(0, 3);
  try {
    localStorage.setItem('planeHighScores', JSON.stringify(highScores));
  } catch(e) {}
}

// ============================================================
// 重置并开始新一局
// ============================================================
function resetGame() {
  score        = 0;
  frameCount   = 0;
  lastFireTime = 0;
  lastSpawnTime = 0;
  bombFlash    = 0;
  lastTapTime  = 0;
  touchMoved   = false;
  bgY1 = 0;
  bgY2 = -H;
  bullets  = [];
  enemies  = [];
  supplies = [];

  initPlayer();
  state = 'PLAYING';

  // 停止旧背景音乐，重新播放
  if (bgmAudio) { try { bgmAudio.pause(); bgmAudio.currentTime = 0; } catch(e){} }
  try {
    bgmAudio = SFX['bgm'].cloneNode();
    bgmAudio.loop   = true;
    bgmAudio.volume = 0.35;
    bgmAudio.muted  = muted; // 继承当前静音状态
    bgmAudio.play().catch(() => {});
  } catch(e) {}
}

// ============================================================
// 射击逻辑
// ============================================================
function fireBullet(now) {
  if (player.dead) return;
  if (now - lastFireTime < FIRE_INTERVAL) return;
  lastFireTime = now;

  const cx = player.x + player.w / 2; // 飞机中心 X
  const by = player.y - 22;           // 子弹起始 Y（飞机顶部略上）

  if (player.bulletMode === 0) {
    // 普通：居中单发
    bullets.push({ x: cx - 5, y: by, w: 10, h: 22, mode: 0 });
  } else {
    // 升级：左右双发（使用 bullet2 贴图）
    bullets.push({ x: cx - 40, y: by, w: 25, h: 22, mode: 1 });
    bullets.push({ x: cx + 15, y: by, w: 25, h: 22, mode: 1 });
  }
}

// ============================================================
// 生成敌机
// ============================================================
function spawnEnemy(now) {
  if (now - lastSpawnTime < SPAWN_INTERVAL) return;
  lastSpawnTime = now;

  // 确定敌机类型：Boss 最多同时一架
  const hasBoss = enemies.some(e => e.type === 3);
  const r = Math.random();
  let type;
  if      (!hasBoss && r < 0.10) type = 3;
  else if (r < 0.30)             type = 2;
  else                           type = 1;

  // 各类型属性
  const cfg = {
    1: { w: 57,  h: 43,  hp: 1,  vy: 2.5, score: 100  },
    2: { w: 69,  h: 99,  hp: 6,  vy: 1.5, score: 200  },
    3: { w: 169, h: 258, hp: 20, vy: 0.8, score: 1000 },
  }[type];

  const x = clamp(Math.random() * (W - cfg.w), 0, W - cfg.w);

  enemies.push({
    type,
    x, y: -cfg.h,  // 从顶部外侧出现
    w: cfg.w, h: cfg.h,
    hp: cfg.hp, maxHp: cfg.hp,
    vy: cfg.vy,
    scoreVal: cfg.score,
    dying: false,
    deathFrame: 0,
    deathTimer: 0,
  });

  if (type === 3) playSound('bossIn');
}

// ============================================================
// 使用炸弹（空格或双击）
// ============================================================
function useBomb() {
  if (state !== 'PLAYING' || player.dead || player.bombs <= 0) return;
  player.bombs--;
  bombFlash = 12;
  playSound('bombUse');

  // 所有存活敌机直接进入死亡动画并立即得分
  enemies.forEach(e => {
    if (e.dying) return;
    e.dying = true;
    e.deathFrame = 0;
    e.deathTimer = 0;
    score += e.scoreVal;
  });
}

// ============================================================
// 玩家中弹（触发死亡流程）
// ============================================================
function hitPlayer() {
  if (player.dead || player.invincible) return;
  player.dead = true;
  player.deathFrame = 0;
  player.deathTimer = 0;
  playSound('playerDie');
}

// ============================================================
// 生成道具补给
// ============================================================
function dropSupply(e, type) {
  const w = type === 'bomb' ? 60 : 58;
  const h = type === 'bomb' ? 107 : 88;
  supplies.push({
    type,
    x: clamp(e.x + e.w / 2 - w / 2, 0, W - w),
    y: e.y + e.h / 2,
    w, h,
    vy: 1.5,
  });
}

// ============================================================
// 主更新函数
// ============================================================
function update(now) {
  frameCount++;

  // ── 背景滚动：两块面板循环 ──
  bgY1 += BG_SCROLL_SPEED;
  bgY2 += BG_SCROLL_SPEED;
  // 当某块面板滚出底部，跳到另一块上方
  if (bgY1 >= H) bgY1 = bgY2 - H;
  if (bgY2 >= H) bgY2 = bgY1 - H;

  // ── 玩家逻辑 ──
  if (!player.dead) {
    // 飞行动画帧切换（每12帧）
    if (++player.frameTimer >= 12) {
      player.frameTimer = 0;
      player.frameIdx = 1 - player.frameIdx;
    }
    // 无敌计时倒计
    if (player.invincible && --player.invincibleTimer <= 0) {
      player.invincible = false;
    }
    // 子弹升级倒计
    if (player.bulletMode === 1 && --player.bulletTimer <= 0) {
      player.bulletMode = 0;
    }
    // 自动射击
    fireBullet(now);
  } else {
    // 死亡动画推进（每10帧换一帧）
    if (++player.deathTimer >= 10) {
      player.deathTimer = 0;
      player.deathFrame++;
      if (player.deathFrame >= 4) {
        // 动画播完，扣生命
        player.lives--;
        if (player.lives > 0) {
          // 复活：重置位置 + 短暂无敌
          player.dead = false;
          player.deathFrame = 0;
          player.x = W / 2 - 51;
          player.y = H - 126 - 30;
          player.invincible = true;
          player.invincibleTimer = INVINCIBLE_FRAMES;
        } else {
          // 生命耗尽 → 游戏结束
          state = 'GAME_OVER';
          saveHighScore(score);
          if (bgmAudio) { try { bgmAudio.pause(); } catch(e){} }
        }
      }
    }
  }

  // ── 子弹移动 & 清理出界 ──
  {
    let w = 0;
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      b.y -= BULLET_SPEED;
      if (b.y + b.h > 0) bullets[w++] = b;
    }
    bullets.length = w;
  }

  // ── 敌机移动、死亡动画、清理 ──
  {
    let w = 0;
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (!e.dying) {
        e.y += e.vy;
        if (e.y > H) continue;
      } else {
        const perFrame = e.type === 3 ? 7 : 5;
        if (++e.deathTimer >= perFrame) {
          e.deathTimer = 0;
          e.deathFrame++;
          const maxFrames = e.type === 1 ? 4 : e.type === 2 ? 5 : 7;
          if (e.deathFrame >= maxFrames) continue;
        }
      }
      enemies[w++] = e;
    }
    enemies.length = w;
  }

  // ── 道具移动 & 清理出界 ──
  {
    let w = 0;
    for (let i = 0; i < supplies.length; i++) {
      const s = supplies[i];
      s.y += s.vy;
      if (s.y < H) supplies[w++] = s;
    }
    supplies.length = w;
  }

  // ── 生成新敌机 ──
  spawnEnemy(now);

  // ── 碰撞：子弹 × 敌机 ──
  {
    let w = 0;
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      let hit = false;
      for (let j = 0; j < enemies.length; j++) {
        const e = enemies[j];
        if (e.dying) continue;
        const hitbox = {
          x: e.x + e.w * 0.1, y: e.y + e.h * 0.1,
          w: e.w * 0.8,        h: e.h * 0.8,
        };
        if (overlaps(b, hitbox)) {
          playSound('hit');
          e.hp--;
          if (e.hp <= 0) {
            e.dying = true;
            e.deathFrame = 0;
            e.deathTimer = 0;
            score += e.scoreVal;
            if (e.type === 1) playSound('die1');
            else if (e.type === 2) {
              playSound('die2');
              if (Math.random() < 0.3) {
                dropSupply(e, Math.random() < 0.5 ? 'bomb' : 'bullet');
              }
            } else {
              playSound('die3');
              dropSupply(e, 'bomb');
              dropSupply(e, 'bullet');
            }
          }
          hit = true;
          break;
        }
      }
      if (!hit) bullets[w++] = b;
    }
    bullets.length = w;
  }

  // ── 碰撞：敌机 × 玩家 ──
  if (!player.dead && !player.invincible) {
    // 玩家碰撞框内缩，主要检测机身区域
    const ph = {
      x: player.x + 15, y: player.y + 20,
      w: player.w - 30, h: player.h - 30,
    };
    for (let e of enemies) {
      if (e.dying) continue;
      if (overlaps(ph, e)) {
        hitPlayer();
        // 碰到玩家的敌机也触发死亡
        e.dying = true;
        e.deathFrame = 0;
        e.deathTimer = 0;
        break; // 一次只处理一架敌机
      }
    }
  }

  // ── 碰撞：道具 × 玩家 ──
  {
    let w = 0;
    for (let i = 0; i < supplies.length; i++) {
      const s = supplies[i];
      if (!player.dead && overlaps(s, player)) {
        if (s.type === 'bomb') {
          player.bombs = Math.min(player.bombs + 1, 9);
          playSound('getBomb');
        } else {
          player.bulletMode = 1;
          player.bulletTimer = UPGRADE_DURATION;
          playSound('getBullet');
          playSound('upgrade');
        }
        continue;
      }
      supplies[w++] = s;
    }
    supplies.length = w;
  }

  // ── 炸弹闪光倒计 ──
  if (bombFlash > 0) bombFlash--;
}

// ============================================================
// 渲染函数
// ============================================================
function draw() {
  ctx.clearRect(0, 0, W, H);

  // ── 1. 滚动背景 ──
  ctx.drawImage(IMG.bg, 0, bgY1, W, H);
  ctx.drawImage(IMG.bg, 0, bgY2, W, H);

  // 接缝处叠加预渲染渐变纹理（弱化硬切线）
  const seamY = Math.max(bgY1, bgY2);
  if (seamY > 0 && seamY < H) {
    ctx.drawImage(blendCanvas, 0, seamY - 100);
  }

  // ── 2. 炸弹爆炸白色闪光 ──
  if (bombFlash > 0) {
    ctx.fillStyle = `rgba(255, 255, 255, ${bombFlash / 12})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ── 3. 道具补给 ──
  supplies.forEach(s => {
    ctx.drawImage(s.type === 'bomb' ? IMG.bombSupply : IMG.bulletSupply,
      s.x, s.y, s.w, s.h);
  });

  // ── 4. 敌机 ──
  // 死亡动画帧表
  const deathFrames = {
    1: [IMG.e1d1, IMG.e1d2, IMG.e1d3, IMG.e1d4],
    2: [IMG.e2d1, IMG.e2d2, IMG.e2d3, IMG.e2d4, IMG.e2d5],
    3: [IMG.e3d1, IMG.e3d2, IMG.e3d3, IMG.e3d4, IMG.e3d5, IMG.e3d6, IMG.e3d7],
  };
  enemies.forEach(e => {
    let img;
    if (!e.dying) {
      img = e.type === 1 ? IMG.e1n : e.type === 2 ? IMG.e2n : IMG.e3n;
    } else {
      const frames = deathFrames[e.type];
      img = frames[Math.min(e.deathFrame, frames.length - 1)];
    }
    if (img) ctx.drawImage(img, e.x, e.y, e.w, e.h);
  });

  // ── 5. 玩家飞机 ──
  if (!player.dead) {
    // 无敌状态闪烁（奇偶帧交替显示）
    const showPlayer = !player.invincible || (frameCount % 6 < 3);
    if (showPlayer) {
      ctx.drawImage(player.frameIdx === 0 ? IMG.plane1 : IMG.plane2,
        player.x, player.y, player.w, player.h);
    }
  } else {
    // 死亡爆炸动画
    const dImgs = [IMG.planeDie1, IMG.planeDie2, IMG.planeDie3, IMG.planeDie4];
    const di = dImgs[Math.min(player.deathFrame, 3)];
    if (di) ctx.drawImage(di, player.x, player.y, player.w, player.h);
  }

  // ── 6. 子弹 ──
  bullets.forEach(b => {
    ctx.drawImage(b.mode === 0 ? IMG.bullet1 : IMG.bullet2, b.x, b.y, b.w, b.h);
  });

  // ── 7. HUD ──
  drawHUD();

  // ── 8. Game Over / Pause 遮罩 ──
  if (state === 'GAME_OVER') drawGameOver();
  if (state === 'PAUSED') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.font = 'bold 30px Arial, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.fillText('暂停中', W / 2, H / 2);
    ctx.restore();
  }
}

// ============================================================
// HUD 绘制（积分 / 生命 / 炸弹）
// ============================================================
function drawHUD() {
  // 积分（左上）
  const scoreStr = '积分: ' + score;
  ctx.save();
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 3;
  ctx.strokeText(scoreStr, 12, 32);
  ctx.fillStyle = '#fff';
  ctx.fillText(scoreStr, 12, 32);
  ctx.restore();

  // 生命图标（左下）
  for (let i = 0; i < player.lives; i++) {
    ctx.drawImage(IMG.lifeIcon, 10 + i * 48, H - 58, 38, 48);
  }

  // 炸弹按钮区域提示（仅当有炸弹且玩家存活时显示）
  if (player.bombs > 0 && !player.dead) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 200, 0, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(BOMB_BTN.x, BOMB_BTN.y, BOMB_BTN.w, BOMB_BTN.h, 10);
    ctx.stroke();
    ctx.restore();
  }

  // 炸弹图标 + 数量（右下）
  if (IMG.bombIcon) {
    ctx.drawImage(IMG.bombIcon, W - 95, H - 55, 38, 35);
  }
  ctx.save();
  ctx.font = 'bold 18px Arial, sans-serif';
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.lineWidth = 3;
  ctx.strokeText('×' + player.bombs, W - 52, H - 28);
  ctx.fillStyle = '#fff';
  ctx.fillText('×' + player.bombs, W - 52, H - 28);
  ctx.restore();

  // 子弹升级提示（顶部中央）
  if (player.bulletMode === 1) {
    ctx.font = 'bold 15px Arial, sans-serif';
    ctx.fillStyle = '#00eeff';
    ctx.textAlign = 'center';
    ctx.fillText('◆ 火力升级中 ◆', W / 2, 32);
    ctx.textAlign = 'left';
  }

  // 右上角静音按钮
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.beginPath();
  ctx.roundRect(MUTE_BTN.x, MUTE_BTN.y, MUTE_BTN.w, MUTE_BTN.h, 6);
  ctx.fill();
  ctx.font = '18px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText(muted ? '🔇' : '🔊', MUTE_BTN.x + MUTE_BTN.w / 2, MUTE_BTN.y + 24);
  ctx.restore();
}

// ============================================================
// Game Over 界面
// ============================================================
function drawGameOver() {
  // 半透明遮罩
  ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
  ctx.fillRect(0, 0, W, H);

  // gameover 图片
  ctx.drawImage(IMG.gameoverImg, W / 2 - 150, H / 2 - 100, 300, 41);

  // 最终得分
  ctx.save();
  ctx.font = 'bold 30px Arial, sans-serif';
  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 6;
  ctx.fillText('最终得分: ' + score, W / 2, H / 2 - 30);
  ctx.restore();

  // again 按钮（居中）
  ctx.drawImage(IMG.againImg, W / 2 - 150, H / 2 + 20, 300, 41);

  // 历史最高分（前三名）
  if (highScores.length > 0) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowBlur = 0;
    ctx.font = 'bold 16px Arial, sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText('— 历史最高分 —', W / 2, H / 2 + 90);
    const medals = ['🥇', '🥈', '🥉'];
    highScores.forEach((s, i) => {
      ctx.font = i === 0 ? 'bold 20px Arial, sans-serif' : '17px Arial, sans-serif';
      ctx.fillStyle = i === 0 ? '#ffd700' : '#ccc';
      ctx.fillText(medals[i] + ' ' + s, W / 2, H / 2 + 118 + i * 26);
    });
    ctx.restore();
  }

  // 退出游戏按钮
  ctx.save();
  ctx.fillStyle = 'rgba(60,60,60,0.75)';
  ctx.beginPath();
  ctx.roundRect(QUIT_BTN.x, QUIT_BTN.y, QUIT_BTN.w, QUIT_BTN.h, 6);
  ctx.fill();
  ctx.font = 'bold 18px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#bbb';
  ctx.fillText('退出游戏', W / 2, QUIT_BTN.y + 23);
  ctx.restore();
}

// ============================================================
// 等待开始画面（iOS 音频解锁：需要在用户手势内调用 audio.play）
// ============================================================
function drawWaiting(now) {
  // 静止背景
  ctx.drawImage(IMG.bg, 0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';

  // 标题
  ctx.font = 'bold 34px Arial, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 8;
  ctx.fillText('经典飞机大战', W / 2, H / 2 - 60);

  // 开始提示（闪烁效果用时间驱动）
  const blink = Math.floor(now / 600) % 2 === 0;
  ctx.font = 'bold 22px Arial, sans-serif';
  ctx.fillStyle = blink ? '#ffd700' : '#ffaa00';
  ctx.shadowBlur = 12;
  ctx.fillText('点击 / 触摸屏幕开始游戏', W / 2, H / 2 + 10);

  // 局域网访问提示（小字）
  ctx.font = '13px Arial, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.shadowBlur = 0;
  ctx.fillText('手机游玩：将手机与电脑接入同一 WiFi', W / 2, H - 90);
  ctx.fillText('终端执行: python3 -m http.server 8080', W / 2, H - 68);
  ctx.fillText('手机浏览器访问: http://<电脑IP>:8080', W / 2, H - 46);

  ctx.restore();
}

// ============================================================
// 加载进度画面
// ============================================================
function drawLoading(loaded, total) {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px Arial, sans-serif';
  ctx.fillText('经典飞机大战', W / 2, H / 2 - 55);
  ctx.font = '18px Arial, sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.fillText('加载资源中...', W / 2, H / 2 - 15);
  // 进度条外框
  const bx = W / 2 - 140, by = H / 2 + 10, bw = 280, bh = 18;
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  // 进度条填充
  ctx.fillStyle = '#00aaff';
  ctx.fillRect(bx + 1, by + 1, (bw - 2) * (loaded / total), bh - 2);
  ctx.restore();
}

// ============================================================
// 主游戏循环
// ============================================================
let _lastFrameTime = 0;
function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  if (now - _lastFrameTime < 16) return; // 限制约 60fps
  _lastFrameTime = now;

  if (state === 'PLAYING' || state === 'PAUSED') {
    if (state === 'PLAYING') update(now);
    draw();
  } else if (state === 'GAME_OVER') {
    // 背景继续滚动，增加动感
    bgY1 += BG_SCROLL_SPEED;
    bgY2 += BG_SCROLL_SPEED;
    if (bgY1 >= H) bgY1 = bgY2 - H;
    if (bgY2 >= H) bgY2 = bgY1 - H;
    draw();
  } else if (state === 'WAITING') {
    // 等待用户点击（每帧重绘以驱动文字闪烁）
    drawWaiting();
  }
}

// ============================================================
// 输入事件处理
// ============================================================

// 触摸设备标记（触摸后忽略 mousemove，避免双重触发导致飞机跳位）
let isTouchDevice = false;
canvas.addEventListener('touchstart', () => { isTouchDevice = true; }, { once: true, passive: true });

// 阻止移动端长按弹出系统菜单
canvas.addEventListener('contextmenu', e => { e.preventDefault(); });

// 页面不可见时自动暂停，回来时恢复
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'PLAYING') {
    prePauseState = state;
    state = 'PAUSED';
    if (bgmAudio) { try { bgmAudio.pause(); } catch(e){} }
  } else if (!document.hidden && state === 'PAUSED') {
    state = prePauseState || 'PLAYING';
    prePauseState = null;
    if (bgmAudio && !muted) {
      try { bgmAudio.play().catch(() => {}); } catch(e) {}
    }
    _lastFrameTime = 0;
  }
});

// 鼠标移动 → 玩家跟随（仅鼠标设备）
canvas.addEventListener('mousemove', e => {
  if (isTouchDevice) return;
  if (state !== 'PLAYING' || player.dead) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  player.x = clamp((e.clientX - rect.left) * scaleX - player.w / 2, 0, W - player.w);
  player.y = clamp((e.clientY - rect.top)  * scaleY - player.h / 2, 0, H - player.h);
});

// 触摸开始 → 记录初始触点与飞机位置（相对移动基准）
let touchBlocked = false; // 触摸落在 UI 按钮上时不触发移动
canvas.addEventListener('touchstart', e => {
  if (state !== 'PLAYING' || player.dead) { touchBlocked = true; return; }
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) * (W / rect.width);
  const ty = (e.touches[0].clientY - rect.top)  * (H / rect.height);
  // 炸弹按钮（仅当有炸弹时响应）
  if (player.bombs > 0 &&
      tx >= BOMB_BTN.x && tx <= BOMB_BTN.x + BOMB_BTN.w &&
      ty >= BOMB_BTN.y && ty <= BOMB_BTN.y + BOMB_BTN.h) {
    useBomb();
    touchBlocked = true;
    return;
  }
  // 静音按钮
  if (tx >= MUTE_BTN.x && tx <= MUTE_BTN.x + MUTE_BTN.w &&
      ty >= MUTE_BTN.y && ty <= MUTE_BTN.y + MUTE_BTN.h) {
    touchBlocked = true;
    toggleMute();
    return;
  }
  touchBlocked = false;
  touchMoved = false;
  touchStartX = tx;
  touchStartY = ty;
  playerStartX = player.x;
  playerStartY = player.y;
}, { passive: true });

// 触摸移动 → 相对偏移控制（手指拖多远飞机就移多远）
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (touchBlocked || state !== 'PLAYING' || player.dead) return;
  const rect = canvas.getBoundingClientRect();
  const dx = (e.touches[0].clientX - rect.left) * (W / rect.width) - touchStartX;
  const dy = (e.touches[0].clientY - rect.top)  * (H / rect.height) - touchStartY;
  if (Math.abs(dx) > 20 || Math.abs(dy) > 20) touchMoved = true;
  player.x = clamp(playerStartX + dx, 0, W - player.w);
  player.y = clamp(playerStartY + dy, 0, H - player.h);
}, { passive: false });

// 空格键 → 使用炸弹
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); useBomb(); }
});

// 鼠标点击 → 炸弹 / 静音按钮 / 开始游戏 / 重开
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const cx = (e.clientX - rect.left) * (W / rect.width);
  const cy = (e.clientY - rect.top)  * (H / rect.height);
  // 炸弹按钮（仅游戏中且炸弹可用）
  if (state === 'PLAYING' && player.bombs > 0 && !player.dead &&
      cx >= BOMB_BTN.x && cx <= BOMB_BTN.x + BOMB_BTN.w &&
      cy >= BOMB_BTN.y && cy <= BOMB_BTN.y + BOMB_BTN.h) {
    useBomb();
    return;
  }
  // 静音按钮优先（仅游戏中）
  if (state === 'PLAYING' &&
      cx >= MUTE_BTN.x && cx <= MUTE_BTN.x + MUTE_BTN.w &&
      cy >= MUTE_BTN.y && cy <= MUTE_BTN.y + MUTE_BTN.h) {
    toggleMute();
    return;
  }
  if (state === 'WAITING') { resetGame(); return; }
  if (state === 'GAME_OVER') {
    if (cx >= QUIT_BTN.x && cx <= QUIT_BTN.x + QUIT_BTN.w &&
        cy >= QUIT_BTN.y && cy <= QUIT_BTN.y + QUIT_BTN.h) {
      state = 'WAITING';
    } else {
      resetGame();
    }
  }
});

// 触摸结束 → 静音按钮 / 开始游戏 / 重开 / 双击炸弹
canvas.addEventListener('touchend', e => {
  const now = Date.now();
  const rect = canvas.getBoundingClientRect();
  const tx = e.changedTouches.length > 0
    ? (e.changedTouches[0].clientX - rect.left) * (W / rect.width) : -1;
  const ty = e.changedTouches.length > 0
    ? (e.changedTouches[0].clientY - rect.top)  * (H / rect.height) : -1;

  const onMuteBtn = tx >= MUTE_BTN.x && tx <= MUTE_BTN.x + MUTE_BTN.w &&
                    ty >= MUTE_BTN.y && ty <= MUTE_BTN.y + MUTE_BTN.h;

  if (state === 'WAITING') {
    if (onMuteBtn) { toggleMute(); return; }
    resetGame(); return;
  }
  if (state === 'GAME_OVER') {
    if (tx >= QUIT_BTN.x && tx <= QUIT_BTN.x + QUIT_BTN.w &&
        ty >= QUIT_BTN.y && ty <= QUIT_BTN.y + QUIT_BTN.h) {
      state = 'WAITING';
    } else {
      resetGame();
    }
    return;
  }
  // PLAYING 状态：UI 按钮优先，跳过炸弹逻辑
  if (onMuteBtn) return;

  // 拖拽移动过则抑制双击炸弹
  if (touchMoved) {
    touchMoved = false;
    lastTapTime = 0;
    return;
  }
  // 双击检测
  if (now - lastTapTime < DOUBLE_TAP_MS) {
    useBomb();
    lastTapTime = 0;
  } else {
    lastTapTime = now;
  }
});

// ============================================================
// 资源预加载 & 游戏启动
// ============================================================
(function loadAssets() {
  // 只等待图片加载完成（音效异步加载，加载失败也不阻塞）
  const total = IMG_LIST.length;
  let loaded = 0;

  drawLoading(0, total);

  function onImgLoad() {
    loaded++;
    drawLoading(loaded, total);
    if (loaded >= total) {
      // 所有图片加载完毕：预载音效，进入 WAITING 等待用户手势
      setTimeout(() => {
        SFX_LIST.forEach(([key, src]) => {
          const audio = new Audio(src);
          audio.preload = 'auto';
          SFX[key] = audio;
        });
        initSfxPool();      // 预建音效池，避免游戏中频繁 cloneNode
        initBlendCanvas();  // 预渲染背景接缝渐变纹理
        loadHighScores();   // 从 localStorage 读取历史最高分
        state = 'WAITING'; // 等用户点击后再 resetGame，确保 iOS 音频可播
        requestAnimationFrame(gameLoop);
      }, 200);
    }
  }

  IMG_LIST.forEach(([key, src]) => {
    const img = new Image();
    img.onload  = onImgLoad;
    img.onerror = onImgLoad; // 容错：加载失败也继续
    img.src = src;
    IMG[key] = img;
  });
})();
</script>
